  gateway-service:
    build: ./gateway-service
    ports:
      - 8094:8094
    environment:
      - AUTH_SERVICE_URL = http://authorization-service:8080
      - USER_SERVICE_URL = http://user-service:8092
      - INGREDIENT_SERVICE_URL = http://ingredient-service:8084


  kafka:
    image: confluentinc/cp-kafka:8.1.1
    restart: unless-stopped
    ports:
      - "29092:29092"
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_NODE_ID: 1
      CLUSTER_ID: lcEE_0O5R_2ueRWWNGLdXg
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka:9093
    healthcheck:
      test: kafka-topics --bootstrap-server localhost:9092 --list
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

volumes:
  auth-db-data:
  user-db-data:
  recipe-db-data:
  ingredient-db-data:
  link-recipe-ingredient-db-data:
  reaction-db-data:
  comment-db-data:
  notification-db-data:
  favorite-db-data:
  proposal-db-data:
  view-history-db-data:
  complaint-db-data:
  kafka_data:

networks:
  app-network:
    driver: bridge